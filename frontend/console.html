<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LastMeter · Operations console</title>
    <link rel="stylesheet" href="/src/console/console.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">LastMeter</div>
      <div class="plant" id="plant-name">Connecting…</div>
      <div class="chips" id="chips"></div>
      <a class="link" href="/index.html">Plant twin</a>
    </header>
    <section class="controls" id="controls"></section>
    <main class="layout">
      <div class="signals" id="signals"></div>
      <aside class="side">
        <section>
          <h2>Signal flags</h2>
          <ul class="flags" id="flags"></ul>
        </section>
        <section>
          <h2>Run</h2>
          <dl class="run" id="run"></dl>
        </section>
      </aside>
    </main>
    <section class="reasoning" id="reasoning">
      <div class="reasoning-head">
        <h2>Investigation — Muse Wonder</h2>
        <span class="muted" id="investigation-status">No live incident</span>
      </div>
      <div class="reasoning-grid">
        <section>
          <h3>Focus ledger</h3>
          <dl class="focus" id="focus"></dl>
          <h3>Field tasks</h3>
          <div id="field-tasks"></div>
        </section>
        <section>
          <h3>Hypothesis tree</h3>
          <div id="hypotheses"></div>
        </section>
        <section>
          <h3>Memory recalled</h3>
          <ul class="recalls" id="recalls"></ul>
          <h3>Timeline</h3>
          <ol class="trace" id="trace"></ol>
        </section>
      </div>
    </section>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/src/console/main.js"></script>
  </body>
</html>
