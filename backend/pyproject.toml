[project]
name = "faultglass-backend"
version = "0.1.0"
description = "FAULTGLASS backend: plant model, telemetry ingest, simulator, edge and investigation worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "pymodbus>=3.7",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pglast>=7",
  "pgserver>=0.1.4",
  "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", "../tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
