[project]
name = "faultglass-backend"
version = "0.1.0"
description = "FAULTGLASS backend: plant model, telemetry ingest, investigation worker"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pglast>=7",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
